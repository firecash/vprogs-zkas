[package]
edition = "2021"
name    = "vprogs-shielded-demo-types"
version = "0.1.0"

# Shared note/nullifier/merkle logic for the shielded-pool demo: the host builds state with
# EXACTLY the functions the guest verifies with, so a passing proof means the host state is the
# unique valid successor.

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2  = { version = "0.10", default-features = false }
