[package]
edition.workspace = true
name              = "vprogs-zk-abi"
version.workspace = true

[features]
default = ["std"]
host = [
  "std",
  "dep:borsh",
  "dep:kaspa-consensus-core",
  "dep:kaspa-rpc-core",
  "dep:vprogs-l1-types",
  "dep:vprogs-scheduling-scheduler",
  "dep:vprogs-storage-types",
]
std = []

# Encodes `canonical-r-probe --emit` output into peg-out ix_data (the relayer's wire half).
[[bin]]
name              = "canonical-r-encode"
path              = "src/bin/canonical_r_encode.rs"
required-features = ["std"]

[dependencies]
# ZKas shielded-state-root recomputation inside the peg-out guest. Must be the same
# personalized blake2b the ZKas chain commits with, so the guest can verify a claimed
# state root rather than trust it. `default-features = false` keeps it no_std for riscv32.
blake2b_simd                = { workspace = true }
borsh                       = { workspace = true, default-features = false, optional = true }
kaspa-consensus-core        = { workspace = true, optional = true }
kaspa-hashes                = { workspace = true }
kaspa-rpc-core              = { workspace = true, optional = true }
kaspa-merkle                = { workspace = true }
kaspa-seq-commit            = { workspace = true }
kaspa-smt                   = { workspace = true }
tap                         = { workspace = true }
thiserror                   = { workspace = true, default-features = false }
vprogs-core-codec           = { workspace = true }
vprogs-core-hashing         = { workspace = true }
vprogs-core-smt             = { workspace = true }
vprogs-core-types           = { workspace = true, default-features = false }
vprogs-l1-types             = { workspace = true, optional = true }
vprogs-l1-utils             = { workspace = true }
vprogs-scheduling-scheduler = { workspace = true, optional = true }
vprogs-storage-types        = { workspace = true, optional = true }
zerocopy                    = { workspace = true }

[dev-dependencies]
tempfile                     = { workspace = true }
vprogs-core-smt              = { workspace = true }
vprogs-storage-rocksdb-store = { workspace = true }
vprogs-storage-types         = { workspace = true }
